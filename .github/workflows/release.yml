name: Release Statix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Go Modules
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./...

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o statix-linux-${{ matrix.goarch }} ./cmd/statix/
          sha256sum statix-linux-${{ matrix.goarch }} > statix-linux-${{ matrix.goarch }}.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: statix-linux-${{ matrix.goarch }}
          path: |
            statix-linux-${{ matrix.goarch }}
            statix-linux-${{ matrix.goarch }}.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Statix ${{ github.ref_name }}
          body: |
            Statix production release ${{ github.ref_name }} for Linux (amd64 and arm64).
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./artifacts/statix-linux-amd64/statix-linux-amd64
            ./artifacts/statix-linux-amd64/statix-linux-amd64.sha256
            ./artifacts/statix-linux-arm64/statix-linux-arm64
            ./artifacts/statix-linux-arm64/statix-linux-arm64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
